<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="480" height="100">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d382" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#916c14" />
    </linearGradient>
  </defs>
  <!-- Emblem Section -->
  <g transform="translate(10, 10)">
    <rect width="80" height="80" rx="14" fill="#111318" stroke="url(#logoGold)" stroke-width="1.5" />
    <circle cx="40" cy="40" r="32" fill="none" stroke="url(#logoGold)" stroke-width="1.2" />
    <path d="M 22 58 L 22 38 C 22 26, 58 26, 58 38 L 58 58 Z" fill="none" stroke="url(#logoGold)" stroke-width="1.6" />
    <path d="M 28 54 C 28 42, 52 42, 52 54 Z" fill="url(#logoGold)" />
    <circle cx="40" cy="37" r="3" fill="url(#logoGold)" />
    <polygon points="40,14 42,18 46,19 43,22 44,26 40,24 36,26 37,22 34,19 38,18" fill="url(#logoGold)" />
    <text x="40" y="52" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#111318" text-anchor="middle">D</text>
  </g>
  
  <!-- Wordmark Section -->
  <g transform="translate(108, 22)">
    <text x="0" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" letter-spacing="0.18em" fill="#ffffff">DHUNKI</text>
    <line x1="2" y1="42" x2="350" y2="42" stroke="url(#logoGold)" stroke-width="1.2" />
    <text x="2" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.22em" fill="#c59b27">FAMILY RESTAURANT &amp; BANQUET</text>
