      <stop offset="0%" stop-color="#f5d382" />
      <stop offset="50%" stop-color="#c59b27" />
      <stop offset="100%" stop-color="#916c14" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0c0d10" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  
